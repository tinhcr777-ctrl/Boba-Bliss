<article class="drink-card"><div class="drink-art art-{{ drink['id'] % 4 }}"><span>{{ drink['emoji'] }}</span><span class="drink-spark">✦</span></div><div class="drink-info"><div class="drink-title-row"><h3>{{ drink['name'] }}</h3><strong>{{ drink['price_cents'] | money }}</strong></div><p>{{ drink['description'] }}</p><a class="btn small" href="{{ url_for('order', drink_id=drink['id']) }}">Order this drink ♡</a></div></article>
